[project]
name = "executive-diligence"
version = "0.2.0"
description = "DeepSeek Harness (DSH) 技能：企业高管背调（公开信息检索、多平台登录获取 Cookie、公众号检索、负面台账）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "playwright>=1.40",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
