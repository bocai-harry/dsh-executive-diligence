name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: pip install ruff playwright openpyxl
      - name: Lint
        run: ruff check skill/scripts tests
      - name: Unit tests (pure logic, no network/browser)
        run: python tests/test_parsers.py
